name: Recover public publisher-embedded X permalinks
on:
  push:
    paths:
      - '.github/workflows/extract-social-permalinks.yml'
      - 'comparative_states_2026.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Recover independently linked public X status URLs without authentication
        run: node scripts/extract_embedded_social.cjs
      - name: Save source-linked candidate list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comparative_x_candidates.json
          git diff --cached --quiet || (git commit -m "Record public-publisher original X permalink candidates" && git push)
