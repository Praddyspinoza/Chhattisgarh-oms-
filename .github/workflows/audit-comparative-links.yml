name: Audit comparative source URLs
on:
  push:
    paths:
      - ".github/workflows/audit-comparative-links.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: comparative-link-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Check public publisher and post URL responses without bypass
        run: node scripts/audit_comparative_links.cjs
      - name: Store audit results for review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comparative_link_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record HTTP source link audit and access restrictions"
          for try in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
