<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Chhattisgarh OMS — Light Theme Trial</title><style>html,body{margin:0;height:100%;background:#f6f7f9}iframe{display:block;border:0;width:100%;height:100dvh}#status{position:fixed;right:12px;bottom:10px;z-index:9999;background:#fff;color:#555;border:1px solid #ddd;border-radius:6px;padding:5px 9px;font:11px system-ui;opacity:.75;pointer-events:none}</style></head><body><iframe id="terminal" title="Chhattisgarh OMS light theme trial" src="./index.html#command"></iframe><div id="status">LIGHT THEME · TRIAL ONLY</div><script>
const LIGHT_CSS="\n:root{\n --bg:#f6f7f9!important;--black:#ffffff!important;\n --navy:#ffffff!important;--navy2:#f7f8fb!important;--navy3:#f0f2f7!important;--navy4:#e9edf4!important;\n --red:#8064af!important;--red2:#755ba5!important;--silver:#30323b!important;\n --muted:#78808c!important;--border:#e2e5eb!important;--soft:#f2f4f8!important;\n --blue:#77aab5!important;--white:#181b22!important;\n color-scheme:light!important;\n}\nhtml,body{background:#f6f7f9!important;color:#30323b!important;font-family:Inter,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Arial,sans-serif!important}\nbody,button,input,select,textarea{font-family:Inter,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Arial,sans-serif!important}\nh1,h2,h3,h4,.hero h1,.leader-top h3,.brandmark{font-family:Inter,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Arial,sans-serif!important}\n.sidebar,.topbar,.cm-sidebar,.cm-panel,.cm-command,.cm-map-shell{background:#fff!important;color:#30323b!important;border-color:#e5e7ed!important}\n.sidebar{background:#fff!important;border-right:1px solid #e5e7ed!important}\n.topbar{background:rgba(255,255,255,.97)!important;border-bottom:1px solid #e5e7ed!important}\n.content,.app,.shell,.stage,.workspace{background:#f6f7f9!important}\n.panel,.metric,.archive-record,.leader-top,.quality-cell,.sidefoot,.alert,.card,.stat-card,.feed-card,.chart-card,.flow-card,.cm-map-card,.cm-issue-tile,.cm-evidence-item,.cm-flow-stat,.cm-totals,.cm-flow-choice,.cm-flow-choices button,.an-card,.an-leader,.an-panel{\n background:#fff!important;color:#30323b!important;border-color:#e5e7ed!important;\n box-shadow:0 2px 10px rgba(22,31,45,.035)!important\n}\n.hero h1,.panel h2,.leader-top h3,.topbrand strong,.metric-n,.archive-record h3,.quality-cell strong,.brand b,.watchperson b,.leader-identity b,.flbody a,.leader-total,.cm-flow-stat b,.cm-totals b{\n color:#20232b!important\n}\n.hero p,.eyebrow,.smallcaps,.panel-head p,.metric-k,.metric-foot,.archive-record p,.note,.micro,.watchperson small,.brand small,.sidecap,.quality-cell small,.rec-people,.evidence,.flbody,.statbar>span,.total-line,.footer-strip,.minor,.hint,.cm-muted{\n color:#737b88!important\n}\n.side-link,.watchperson,.person-toggle,.action,.tag,.issue-chip,.sourceflag,.toolbar .period,.roundel,.day,.status,.filterline select,.filterline input,.modal input,.modal select,.modal textarea,.cm-flow-choices button,.cm-issue-tile{\n background:#f8f9fb!important;color:#464b56!important;border-color:#e3e6ec!important\n}\n.side-link:hover,.side-link.on,.person-toggle.on,.tab.active,.cm-flow-choices button.active,.cm-issue-tile.active,.cm-map-card.cm-selected{\n background:#f0ecf8!important;color:#6d539c!important;border-color:#cdbfe2!important\n}\n.action.primary,.button-primary,.btn-primary{background:#8064af!important;color:#fff!important;border-color:#8064af!important}\n.brandmark,.roundel.big{background:#f0ecf8!important;color:#745b9f!important;border-color:#d6c9e8!important}\n.alert{border-left:3px solid #8064af!important}\n.tag.highlight,.status.warning{background:#fff5f7!important;color:#b16d83!important;border-color:#f2dce4!important}\n.status.ok{background:#eef8f5!important;color:#418978!important;border-color:#d6ece4!important}\n.metric,.panel,.archive-record,.quality-cell{border-radius:12px!important}\n.metric-n small,.source-link,.panel .minor{color:#8064af!important}\n.statbar .track,.minor-track{background:#e8eaf0!important}\n.statbar .track i,.minor-track span{background:linear-gradient(90deg,#8064af,#b5a2d5)!important}\n::-webkit-scrollbar-thumb{background:#cfd4dc!important}\n*{scrollbar-color:#cfd4dc transparent}\ninput,select,textarea{background:#fff!important;color:#242831!important;border-color:#dce1e8!important}\ninput::placeholder,textarea::placeholder{color:#969ca6!important}\na{color:inherit}\na:hover{color:#7459a7}\nsvg text{fill:#59616d}\nsvg .cm-flow-arrow,svg .cm-connector{stroke:#b8a6d4!important}\n.cm-lineage{background:#fff!important;border-color:#e5e7ed!important}\n.cm-flow-arrow{background:#c4b5dc!important;color:#8168ad!important}\n.cm-district{stroke:#fff!important}\n.cm-district.cm-target{filter:drop-shadow(0 0 6px rgba(128,100,175,.34))!important}\n.cm-map-card.cm-dim{opacity:.58}\n.cm-flow-stat,.cm-issue-tile,.cm-map-card,.cm-evidence-item{color:#333840!important}\n.cm-flow-arrow::before{background:#8064af!important;box-shadow:0 0 6px #bca6db!important}\n.cm-lineage::before{background:linear-gradient(90deg,transparent,#d3c6e9,#8064af,#d3c6e9,transparent)!important}\n.cm-map-card svg,.cm-map-card svg *{transition-property:fill,stroke,opacity,filter,transform!important}\ntable,th,td{border-color:#e4e6ed!important}\nth{color:#555d6b!important}\ntbody tr:hover{background:#f5f3fa!important}\n@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important}}\n";
const frame=document.getElementById("terminal");
function applyTheme(){try{const doc=frame.contentDocument;if(!doc)return;let style=doc.getElementById("oms-plain-theme-trial");if(!style){style=doc.createElement("style");style.id="oms-plain-theme-trial";style.textContent=LIGHT_CSS;doc.head.appendChild(style);}doc.documentElement.style.colorScheme="light";}catch(e){document.getElementById("status").textContent="Theme loading unavailable";}}

</script></body></html>
