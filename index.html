/* Read the existing map's rendered counts; never replace district geometry, records or handlers. */
function installTrialMaps(doc) {
  if (!doc || !doc.defaultView) return;
  if (doc.__omsTrialMaps) { doc.__omsTrialMaps.refresh(); return; }
  const win=doc.defaultView, NS='http://www.w3.org/2000/svg';
  let queued=false, lastCG='';
  const palette=['#e2f0ef','#a4d4d0','#78b9b5','#438e90'];
  function node(tag,attrs,text) {
    const el=doc.createElementNS(NS,tag);
    Object.keys(attrs||{}).forEach(k=>el.setAttribute(k,attrs[k]));
    if(text!==undefined)el.textContent=text;
    return el;
  }
  function records(path) {
    const label=path.getAttribute('aria-label')||'';
    const found=label.match(/,\s*(\d+)\s+indexed records/)||label.match(/:\s*(\d+)\s+matching source items/);
    return found?Number(found[1]):0;
  }
  function shade(value,max) {
    if(!value)return '#fcfdfb';
    const ratio=Math.log1p(value)/Math.log1p(Math.max(1,max));
    return palette[ratio<.30?0:ratio<.52?1:ratio<.78?2:3];
  }
  function colorPaths(svg,selector) {
    const paths=Array.from(svg.querySelectorAll(selector));
    const max=Math.max(1,...paths.map(records));
    paths.forEach(path=>{
      const color=shade(records(path),max);
      if(path.style.getPropertyValue('--trial-map-fill')!==color)path.style.setProperty('--trial-map-fill',color);
    });
    return paths;
  }
  function pointInDistrict(path) {
    const box=path.getBBox(), svg=path.ownerSVGElement, pt=svg.createSVGPoint();
    for(const pair of [[.5,.5],[.4,.5],[.6,.5],[.5,.4],[.5,.6],[.35,.35],[.65,.65],[.3,.6],[.7,.4]]){
      pt.x=box.x+box.width*pair[0];pt.y=box.y+box.height*pair[1];
      if(!path.isPointInFill||path.isPointInFill(pt))return {x:pt.x,y:pt.y};
    }
    return {x:box.x+box.width/2,y:box.y+box.height/2};
  }
  function cgLabels(svg,paths) {
    if(!svg.getBoundingClientRect().width)return;
    const signature=paths.map(p=>(p.dataset.name||'')+':'+records(p)+':'+p.classList.contains('cg-selected')).join('|');
    if(signature===lastCG&&svg.querySelector('.trial-map-labels'))return;
    lastCG=signature;
    const previous=svg.querySelector('.trial-map-labels');
    if(previous)previous.remove();
    const ranked=paths.filter(p=>records(p)>0).sort((a,b)=>records(b)-records(a)).slice(0,5);
    const selected=paths.find(p=>p.classList.contains('cg-selected'));
    if(selected&&!ranked.includes(selected))ranked.push(selected);
    const labels=node('g',{class:'trial-map-labels','aria-hidden':'true'}),taken=[];
    ranked.forEach((path,i)=>{
      const point=pointInDistrict(path), label=(path.dataset.name||'District')+' · '+records(path);
      const width=Math.min(235,Math.max(96,label.length*7.1+20)),height=28;
      let best=null,score=Infinity;
      for(const dy of [-42,24,-78,60,-114,96])for(const dx of [17,-width-17,-width/2]) {
        const x=Math.max(12,Math.min(608-width,point.x+dx)),y=Math.max(15,Math.min(758,point.y+dy));
        let overlap=0;
        taken.forEach(t=>{overlap+=Math.max(0,Math.min(x+width,t.x+t.w)-Math.max(x,t.x))*Math.max(0,Math.min(y+height,t.y+t.h)-Math.max(y,t.y));});
        const penalty=overlap*100+Math.hypot(x+width/2-point.x,y+height/2-point.y);
        if(penalty<score){score=penalty;best={x,y,w:width,h:height};}
      }
      taken.push(best);
      const group=node('g',{});
      group.appendChild(node('path',{class:'trial-map-label-wire',d:'M'+point.x.toFixed(1)+' '+point.y.toFixed(1)+'L'+(best.x+width/2).toFixed(1)+' '+(best.y+height/2).toFixed(1)}));
      group.appendChild(node('circle',{class:'trial-map-marker',cx:point.x,cy:point.y,r:6.4}));
      group.appendChild(node('circle',{class:'trial-map-marker-core',cx:point.x,cy:point.y,r:2.1}));
      group.appendChild(node('rect',{class:'trial-map-label-bg',x:best.x,y:best.y,width,height,rx:13}));
      group.appendChild(node('text',{class:'trial-map-label-text',x:best.x+width/2,y:best.y+height/2,'text-anchor':'middle'},label));
      labels.appendChild(group);
    });
    svg.appendChild(labels);
  }
  function comparativeMarkers(svg) {
    svg.querySelectorAll('.cm-hot-label').forEach(label=>{
      const rect=label.querySelector('.cm-label-bg');
      if(rect)rect.setAttribute('rx','6.5');
      if(label.querySelector('.trial-map-marker'))return;
      const wire=label.querySelector('.cm-label-wire');
      const coords=wire&&wire.getAttribute('d').match(/^M\s*([\d.-]+)[ ,]+([\d.-]+)/);
      if(!coords)return;
      const marker=node('circle',{class:'trial-map-marker',cx:coords[1],cy:coords[2],r:2.7});
      const core=node('circle',{class:'trial-map-marker-core',cx:coords[1],cy:coords[2],r:.85});
      label.insertBefore(marker,rect||null);label.insertBefore(core,rect||null);
    });
  }
  function paint() {
    queued=false;
    const cg=doc.getElementById('cgDistrictMap');
    if(cg)cgLabels(cg,colorPaths(cg,'.cg-poly'));
    doc.querySelectorAll('#omsCommandMap .cm-svg').forEach(svg=>{
      colorPaths(svg,'.cm-district.cm-polygon');comparativeMarkers(svg);
    });
  }
  function refresh() {
    if(!queued){queued=true;win.requestAnimationFrame(paint);}
  }
  const observer=new win.MutationObserver(changes=>{
    const relevant=changes.some(change=>{
      if(change.type==='attributes')return change.target.matches('.cg-poly,.cm-district,.view');
      return Array.from(change.addedNodes).some(n=>n.nodeType===1&&(n.matches('.cm-svg,#cgDistrictMap')||n.querySelector('.cm-svg,#cgDistrictMap')));
    });
    if(relevant)refresh();
  });
  observer.observe(doc.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['aria-label','class']});
  win.addEventListener('hashchange',refresh);
  win.addEventListener('resize',refresh);
  doc.__omsTrialMaps={refresh,disconnect:()=>observer.disconnect()};
  paint();
}


const TRIAL_THEME_VERSION = "20261122-oms-permanent";
const frame = document.getElementById("terminal");
const themedDocuments = new WeakSet();
const boundFrames = new WeakSet();

function themeDocument(doc) {
  if (!doc || !doc.head || !doc.defaultView) return;
  let style = doc.getElementById("oms-plain-theme-trial");
  if (!style) {
    style = doc.createElement("style");
    style.id = "oms-plain-theme-trial";
    style.textContent = TRIAL_CSS;
    doc.head.appendChild(style);
  }
  doc.documentElement.style.colorScheme = "light";
  doc.documentElement.dataset.trialTheme = TRIAL_THEME_VERSION;
  installTrialMaps(doc);

  function bindNestedFrame(child) {
    if (!boundFrames.has(child)) {
      boundFrames.add(child);
      child.addEventListener("load", function () {
        try { themeDocument(child.contentDocument); } catch (_) { /* External source embeds keep their own origin. */ }
      });
    }
    try { themeDocument(child.contentDocument); } catch (_) { /* Only same-origin documents can receive this theme. */ }
  }
  doc.querySelectorAll("iframe").forEach(bindNestedFrame);
  if (themedDocuments.has(doc)) return;
  themedDocuments.add(doc);
  // The district atlas is lazy-loaded. Apply the same theme when it becomes available.
  const nestedFrames = new doc.defaultView.MutationObserver(function (changes) {
    changes.forEach(function (change) {
      change.addedNodes.forEach(function (node) {
        if (node.nodeType !== 1) return;
        if (node.matches("iframe")) bindNestedFrame(node);
        node.querySelectorAll("iframe").forEach(bindNestedFrame);
      });
    });
  });
  nestedFrames.observe(doc.documentElement, { childList: true, subtree: true });
}

function applyTheme() {
  try {
    themeDocument(frame.contentDocument);
    frame.style.visibility = "visible";
    document.getElementById("status").textContent = "LIGHT THEME · TRIAL ONLY";
  } catch (error) {
    frame.style.visibility = "visible";
    document.getElementById("status").textContent = "Theme loading unavailable";
    console.error("Light trial theme:", error);
  }
}
frame.addEventListener("load", applyTheme);
window.addEventListener("message", applyTheme);
if (frame.contentDocument && frame.contentDocument.readyState === "complete") applyTheme();
